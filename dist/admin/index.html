<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#061a31" />
    <title>LAKDEALZ Secure Admin</title>
    <style>
      :root {
        --navy: #061a31;
        --gold: #f1b746;
        --ink: #122033;
        --muted: #64748b;
        --line: #dce5ee;
        --bg: #f3f6f9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, system-ui, sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      .top {
        background: var(--navy);
        color: #fff;
        padding: 18px max(18px, calc((100vw - 1180px) / 2));
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        font-weight: 950;
        font-size: 1.2rem;
      }
      .logo span {
        color: var(--gold);
      }
      .wrap {
        max-width: 1180px;
        margin: auto;
        padding: 30px 16px;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 12px 30px #08233b10;
      }
      .login {
        max-width: 450px;
        margin: 10vh auto;
      }
      .form {
        display: grid;
        gap: 12px;
      }
      .form input {
        width: 100%;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 11px;
      }
      .btn {
        border: 0;
        border-radius: 11px;
        padding: 12px 14px;
        font-weight: 850;
        cursor: pointer;
      }
      .primary {
        background: var(--navy);
        color: #fff;
      }
      .approve {
        background: #e7f8f1;
        color: #087352;
      }
      .danger {
        background: #fff0f1;
        color: #ac1730;
      }
      .outline {
        background: #fff;
        border: 1px solid var(--line);
      }
      .hide {
        display: none !important;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin: 20px 0;
      }
      .stat {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 17px;
      }
      .stat b {
        font-size: 1.6rem;
        display: block;
      }
      .tabs {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .tabs button.active {
        background: var(--navy);
        color: #fff;
      }
      .list {
        display: grid;
        gap: 12px;
      }
      .row {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 15px;
        display: grid;
        grid-template-columns: 92px 1fr auto;
        gap: 14px;
        align-items: center;
      }
      .row img {
        width: 92px;
        height: 76px;
        object-fit: cover;
        border-radius: 10px;
        background: #e9eef4;
      }
      .row h3 {
        margin: 0 0 5px;
      }
      .meta {
        color: var(--muted);
        font-size: 0.82rem;
      }
      .actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .notice {
        padding: 12px;
        border-radius: 11px;
        background: #fff6dc;
        color: #73500d;
        margin: 12px 0;
      }
      .empty {
        text-align: center;
        padding: 40px;
        color: var(--muted);
      }
      @media (max-width: 700px) {
        .stats {
          grid-template-columns: 1fr 1fr;
        }
        .row {
          grid-template-columns: 70px 1fr;
        }
        .row img {
          width: 70px;
          height: 65px;
        }
        .actions {
          grid-column: 1/-1;
          justify-content: stretch;
        }
        .actions button {
          flex: 1;
        }
        .top small {
          display: none;
        }
      }
    </style>
    <link rel="stylesheet" href="../premium.css?v=3" />
  </head>
  <body class="admin-page">
    <header class="top">
      <div class="logo">LAK<span>DEALZ</span> ADMIN</div>
      <small>Secure marketplace moderation</small>
    </header>
    <main class="wrap">
      <section id="login" class="panel login">
        <h1>Admin sign in</h1>
        <p>Use the authorized LAKDEALZ administrator account. Access is verified by your database role.</p>
        <form id="loginForm" class="form">
          <input
            id="email"
            type="email"
            required
            placeholder="Admin email"
          /><input
            id="password"
            type="password"
            required
            minlength="8"
            placeholder="Password"
          /><button class="btn primary">Sign in securely</button>
        </form>
        <div id="message" class="notice hide"></div>
      </section>
      <section id="dashboard" class="hide">
        <div class="panel">
          <div
            style="
              display: flex;
              justify-content: space-between;
              gap: 12px;
              align-items: center;
            "
          >
            <div>
              <h1 style="margin: 0">Marketplace control</h1>
              <div class="meta" id="adminEmail"></div>
            </div>
            <button class="btn outline" id="logout">Sign out</button>
          </div>
        </div>
        <div class="stats" id="stats"></div>
        <div class="tabs">
          <button class="btn active" data-tab="pending">Pending ads</button
          ><button class="btn outline" data-tab="approved">Live ads</button
          ><button class="btn outline" data-tab="reports">Scam reports</button>
        </div>
        <div class="list" id="content"></div>
      </section>
    </main>
    <script>
      const BASE = "https://hdnyzxlbowobbteozvlu.supabase.co",
        KEY = "sb_publishable__l5i73Qd8ac7jO4Y1sIcYw_5POlmbmA",
        token = () => sessionStorage.getItem("lak_admin_token"),
        $ = (s) => document.querySelector(s);
      let ads = [],
        reports = [],
        tab = "pending";
      async function api(path, opt = {}) {
        let r = await fetch(BASE + path, {
            ...opt,
            headers: {
              apikey: KEY,
              Authorization: "Bearer " + (token() || KEY),
              "Content-Type": "application/json",
              ...(opt.headers || {}),
            },
          }),
          d = null;
        try {
          d = await r.json();
        } catch {}
        if (!r.ok)
          throw Error(d?.message || d?.error_description || "Request failed");
        return d;
      }
      function msg(t) {
        $("#message").textContent = t;
        $("#message").classList.remove("hide");
      }
      $("#loginForm").onsubmit = async (e) => {
        e.preventDefault();
        let b = e.submitter;
        b.disabled = true;
        try {
          let a = await api("/auth/v1/token?grant_type=password", {
            method: "POST",
            body: JSON.stringify({
              email: $("#email").value,
              password: $("#password").value,
            }),
          });
          sessionStorage.setItem("lak_admin_token", a.access_token);
          await enter();
        } catch (x) {
          msg(x.message);
        } finally {
          b.disabled = false;
        }
      };
      async function enter() {
        let u = await api("/auth/v1/user"),
          p = await api("/rest/v1/profiles?id=eq." + u.id + "&select=role");
        if (p[0]?.role !== "admin") {
          sessionStorage.removeItem("lak_admin_token");
          throw Error("This account is not authorized as an administrator.");
        }
        $("#login").classList.add("hide");
        $("#dashboard").classList.remove("hide");
        $("#adminEmail").textContent = u.email;
        await load();
      }
      async function load() {
        [ads, reports] = await Promise.all([
          api("/rest/v1/ads?select=*&order=created_at.desc"),
          api("/rest/v1/reports?select=*&order=created_at.desc"),
        ]);
        $("#stats").innerHTML =
          `<div class="stat"><b>${ads.length}</b>Total ads</div><div class="stat"><b>${ads.filter((x) => x.status === "pending").length}</b>Pending</div><div class="stat"><b>${ads.filter((x) => x.status === "approved").length}</b>Live</div><div class="stat"><b>${reports.filter((x) => x.status !== "resolved").length}</b>Open reports</div>`;
        render();
      }
      function render() {
        let items =
          tab === "reports" ? reports : ads.filter((x) => x.status === tab);
        $("#content").innerHTML = items.length
          ? items
              .map((x) =>
                tab === "reports"
                  ? `<article class="row"><div>🚩</div><div><h3>${x.reason}</h3><div class="meta">Ad ${x.ad_id || "removed"} · ${new Date(x.created_at).toLocaleString()}</div><p>${x.details}</p></div><div class="actions"><button class="btn outline" onclick="reportStatus('${x.id}','reviewing')">Reviewing</button><button class="btn approve" onclick="reportStatus('${x.id}','resolved')">Resolve</button></div></article>`
                  : `<article class="row"><img src="${x.images?.[0] || ""}" alt=""><div><h3>${x.title}</h3><div class="meta">Rs. ${Number(x.price).toLocaleString()} · ${x.district} · ${x.category}</div><p>${x.description || ""}</p></div><div class="actions">${tab === "pending" ? `<button class="btn approve" onclick="adStatus('${x.id}','approved')">Approve</button><button class="btn danger" onclick="adStatus('${x.id}','rejected')">Reject</button>` : `<button class="btn outline" onclick="adStatus('${x.id}','paused')">Pause</button>`}<button class="btn danger" onclick="deleteAd('${x.id}')">Delete</button></div></article>`,
              )
              .join("")
          : '<div class="panel empty">Nothing to review here.</div>';
      }
      async function adStatus(id, status) {
        await api("/rest/v1/ads?id=eq." + id, {
          method: "PATCH",
          headers: { Prefer: "return=minimal" },
          body: JSON.stringify({
            status,
            updated_at: new Date().toISOString(),
          }),
        });
        await load();
      }
      async function deleteAd(id) {
        if (!confirm("Permanently delete this ad?")) return;
        await api("/rest/v1/ads?id=eq." + id, { method: "DELETE" });
        await load();
      }
      async function reportStatus(id, status) {
        await api("/rest/v1/reports?id=eq." + id, {
          method: "PATCH",
          headers: { Prefer: "return=minimal" },
          body: JSON.stringify({ status }),
        });
        await load();
      }
      document.querySelectorAll("[data-tab]").forEach(
        (b) =>
          (b.onclick = () => {
            tab = b.dataset.tab;
            document
              .querySelectorAll("[data-tab]")
              .forEach((x) => (x.className = "btn outline"));
            b.className = "btn active";
            render();
          }),
      );
      $("#logout").onclick = () => {
        sessionStorage.removeItem("lak_admin_token");
        location.reload();
      };
      if (token())
        enter().catch((x) => {
          msg(x.message);
          $("#login").classList.remove("hide");
        });
    </script>
  </body>
</html>
